version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: vuln-db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
    volumes:
      - db-data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - vuln-network

  app-vulnerable:
    build:
      context: ./app-vulnerable
      dockerfile: Dockerfile
    container_name: vuln-app-vulnerable
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./app-vulnerable/public:/var/www/html/public:ro
      - ./app-vulnerable/src:/var/www/html/src:ro
      - vuln-vulnerable-uploads:/var/www/html/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vuln-network

  app-fixed:
    build:
      context: ./app-fixed
      dockerfile: Dockerfile
    container_name: vuln-app-fixed
    restart: always
    ports:
      - "8081:80"
    volumes:
      - ./app-fixed/public:/var/www/html/public:ro
      - ./app-fixed/src:/var/www/html/src:ro
      - vuln-fixed-uploads:/var/www/html/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vuln-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: vuln-phpmyadmin
    restart: always
    ports:
      - "8082:80"
    environment:
      PMA_ARBITRARY: 1
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vuln-network

networks:
  vuln-network:
    driver: bridge

volumes:
  db-data:
  vuln-vulnerable-uploads:
  vuln-fixed-uploads:
